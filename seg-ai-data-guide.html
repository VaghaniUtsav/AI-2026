<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEG AI Data Guide</title>
<script>
// Theme and language are set before the page is drawn, so a stored choice never flashes the other theme
// and the switches' knobs don't slide on load.
(() => {
  const root = document.documentElement;
  let t, l;
  try { t = localStorage.getItem("seg-ai-data-guide.theme"); l = localStorage.getItem("seg-ai-data-guide.lang"); } catch (e) {}  // storage can be blocked
  root.dataset.theme = t === "dark" || t === "light" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  if (l === "en") root.lang = "en";
})();
</script>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --soft: #f4f6f9; --ink: #0f172a; --muted: #5b6576; --line: #e5e7eb; --edge: #7d8799;
  --blue: #2563eb; --blue-soft: #eff5ff;
  --ok: #15803d; --ok-bg: #ecfdf3; --ok-ink: #14532d;
  --cond: #b45309; --cond-bg: #fff7e8; --cond-ink: #7c2d12;
  --int: #1d4ed8; --int-bg: #eef2ff; --int-ink: #1e3a8a;
  --no: #b91c1c; --no-bg: #fef1f1; --no-ink: #7f1d1d;
  --clar: #475569; --clar-bg: #f1f5f9; --clar-ink: #1e293b;
  --gutter: 16px;
}
/* The script in <head> sets data-theme from the stored choice, else from the device; dark is for the screen only. */
@media screen {
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f141b; --soft: #18202b; --ink: #e8edf4; --muted: #9ba6b7; --line: #283242; --edge: #76829a;
    --blue: #7aaaff; --blue-soft: #152440;
    --ok: #6fd49a; --ok-bg: #11281b; --ok-ink: #a7f0c4;
    --cond: #f0b85a; --cond-bg: #2d2310; --cond-ink: #fbd99a;
    --int: #8fb8f5; --int-bg: #16233d; --int-ink: #c3d8fb;
    --no: #f28b82; --no-bg: #341716; --no-ink: #fbc4be;
    --clar: #a7b3c4; --clar-bg: #1b2330; --clar-ink: #dbe3ee;
  }
}
@media (min-width: 640px) { :root { --gutter: 24px; } }
/* Each answer brings its own colour; components only read --c (accent), --c-bg (tint) and --c-ink (text on the tint). */
.v-not_permitted { --c: var(--no); --c-bg: var(--no-bg); --c-ink: var(--no-ink); }
.v-internal_ai_only { --c: var(--int); --c-bg: var(--int-bg); --c-ink: var(--int-ink); }
.v-permitted_with_conditions { --c: var(--cond); --c-bg: var(--cond-bg); --c-ink: var(--cond-ink); }
.v-permitted { --c: var(--ok); --c-bg: var(--ok-bg); --c-ink: var(--ok-ink); }
.v-clarify_first { --c: var(--clar); --c-bg: var(--clar-bg); --c-ink: var(--clar-ink); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-bottom: 96px; }  /* keeps focused controls clear of the sticky action bar */
body { margin: 0; background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%;
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.wrap { max-width: calc(600px + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter) 24px; }
a { color: var(--blue); text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2 { letter-spacing: -.015em; }
fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
legend { padding: 0; }
ul, ol { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pending { color: var(--muted); font-style: italic; }
/* Header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; }
.brand b { color: var(--ink); font-weight: 700; }
.logo-slot:empty { display: none; }
.logo-slot img { display: block; max-height: 28px; max-width: 120px; }
.tools, .lang { display: flex; align-items: center; }
.tools { gap: 4px; }
/* Language switch, drawn like the light/dark switch: a track (::before) and a knob (::after) that slides under the
   chosen language. The buttons stay 44px tall and sit above both. */
.lang { position: relative; flex: none; }
.lang::before { content: ""; position: absolute; inset: 7px 0; border: 1.5px solid var(--edge); border-radius: 999px; background: var(--soft); }
.lang::after { content: ""; position: absolute; top: 10px; left: 3px; width: 38px; height: 24px; border-radius: 999px;
  background: var(--ink); transition: transform .3s cubic-bezier(.4, 0, .2, 1); }
html[lang="en"] .lang::after { transform: translateX(44px); }
.textbtn { position: relative; z-index: 1; font: inherit; font-size: 13px; font-weight: 700; width: 44px; min-height: 44px; padding: 0;
  border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; transition: color .3s; }
.textbtn:hover { color: var(--ink); }
.textbtn[aria-pressed="true"] { color: var(--bg); }
/* Light/dark switch: the knob slides and the sun turns into the moon. */
.theme { flex: none; display: grid; place-items: center; min-width: 60px; min-height: 44px; padding: 0; border: 0;
  border-radius: 999px; background: none; cursor: pointer; }
.theme .track { position: relative; width: 52px; height: 30px; border: 1.5px solid var(--edge); border-radius: 999px; background: var(--soft); }
.theme .knob { position: absolute; top: 2.5px; left: 2.5px; display: grid; place-items: center; width: 22px; height: 22px;
  border-radius: 50%; background: var(--ink); color: var(--bg); transition: transform .3s cubic-bezier(.4, 0, .2, 1); }
.theme svg { position: absolute; width: 14px; height: 14px; transition: opacity .3s, transform .3s; }
.theme .moon, [aria-checked="true"] .sun { opacity: 0; transform: rotate(-90deg) scale(.5); }
[aria-checked="true"] > .track .knob { transform: translateX(22px); }
[aria-checked="true"] .moon { opacity: 1; transform: none; }
/* Colours fade only while the theme switches, so hovers and ticks stay instant. */
@media (prefers-reduced-motion: no-preference) {
  .theming, .theming *, .theming *::before, .theming *::after {
    transition: background-color .35s, color .35s, border-color .35s, box-shadow .35s, outline-color .35s !important;
  }
  .theming .knob { transition: transform .3s cubic-bezier(.4, 0, .2, 1), background-color .35s, color .35s !important; }
  .theming .theme svg { transition: opacity .3s, transform .3s !important; }
}

/* Shared pieces */
.btn { font: inherit; font-size: 16px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 12px 22px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg);
  text-align: center; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.ghost:hover { background: var(--soft); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.lead { color: var(--muted); }
.quote { padding: 14px 16px; border-radius: 16px; background: var(--soft); font-size: 15px; }
.tag { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; line-height: 1.4;
  white-space: nowrap; color: var(--c); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.steps { list-style: none; padding: 0; counter-reset: s; display: grid; gap: 10px; }
.steps > li { counter-increment: s; display: flex; gap: 12px; }
.steps > li::before { content: counter(s); flex: none; display: grid; place-items: center; width: 24px; height: 24px;
  border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; }

/* Data check */
.screen { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
.enter { animation: enter .22s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
.check h1 { font-size: 24px; line-height: 1.22; font-weight: 750; }
.check[data-step="start"] h1 { font-size: 32px; line-height: 1.12; margin-top: 8px; }
.kicker { margin-top: -6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.progress i.on { background: var(--ink); }
.note { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.note svg { flex: none; width: 16px; height: 16px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
.tile { position: relative; display: grid; align-content: start; gap: 6px; padding: 14px 12px; border-radius: 16px;
  box-shadow: inset 0 0 0 1.5px var(--line); cursor: pointer; }
.tile:hover { background: var(--soft); }
.tile input { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.tile .ic { width: 22px; height: 22px; }
.tile b { font-size: 14.5px; line-height: 1.25; overflow-wrap: break-word; }
.tile small { font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.tile .tick { position: absolute; top: 10px; right: 10px; display: none; place-items: center; width: 22px; height: 22px;
  border-radius: 50%; background: var(--blue); color: var(--bg); }
.tile .tick svg { width: 13px; height: 13px; }
.tile:has(input:checked) { background: var(--blue-soft); box-shadow: inset 0 0 0 2px var(--blue); }
.tile:has(input:checked) .tick { display: grid; }
.tile:has(input:focus-visible) { outline: 3px solid var(--blue); outline-offset: 2px; }

.search { font: inherit; width: 100%; min-height: 48px; padding: 10px 14px; border: 1.5px solid var(--edge); border-radius: 12px;
  background: var(--bg); color: var(--ink); }
.group > legend { margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: flex-start; gap: 12px; min-height: 48px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row .t { flex: 1; min-width: 0; font-size: 15px; line-height: 1.4; overflow-wrap: break-word; }
.cb { appearance: none; flex: none; display: grid; place-items: center; width: 22px; height: 22px; margin: 0;
  border: 1.5px solid var(--edge); border-radius: 7px; background: var(--bg); cursor: pointer; }
.cb::after { content: ""; display: none; width: 6px; height: 11px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0;
  transform: translateY(-1px) rotate(45deg); }
.cb:checked { border-color: var(--blue); background: var(--blue); }
.cb:checked::after { display: block; }
.empty-note { font-size: 15px; color: var(--muted); }

.ccard { display: grid; gap: 12px; padding: 16px; border-radius: 16px; box-shadow: inset 0 0 0 1.5px var(--line); }
.ccard > legend { float: left; width: 100%; font-weight: 650; }  /* a floated legend sits inside the card's padding */
.ccard p { font-size: 15px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); overflow: hidden; border-radius: 12px; box-shadow: inset 0 0 0 1.5px var(--line); }
.seg label { position: relative; display: grid; place-items: center; min-height: 44px; padding: 8px 4px;
  font-size: 14.5px; font-weight: 650; text-align: center; cursor: pointer; }
.seg label + label { box-shadow: inset 1.5px 0 0 var(--line); }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--blue); outline-offset: -3px; }

.hero { display: grid; gap: 10px; padding: 20px; border-radius: 22px; background: var(--c-bg); }
.ring { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--c); color: var(--bg); }
.ring svg { width: 26px; height: 26px; }
.check .hero h1 { font-size: 27px; line-height: 1.15; font-weight: 800; color: var(--c-ink); }
.hero p { font-size: 15px; }
.why { font-size: 15px; }
.todo { display: grid; gap: 10px; font-size: 15px; }
.todo h2 { font-size: 16px; font-weight: 700; letter-spacing: 0; }
.must { list-style: none; padding: 0; display: grid; gap: 10px; }
.must li { display: flex; gap: 10px; }
.must svg { flex: none; width: 20px; height: 20px; margin-top: 1px; color: var(--cond); }
.more { border-top: 1px solid var(--line); }
.more:last-child { border-bottom: 1px solid var(--line); }
.more > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 12px 0;
  font-size: 15px; font-weight: 600; list-style: none; cursor: pointer; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::after { content: "›"; color: var(--muted); font-size: 22px; line-height: 1; transition: transform .2s; }
.more[open] > summary::after { transform: rotate(90deg); }
.more > div { display: grid; gap: 10px; padding: 0 0 16px; font-size: 15px; }
.more h3 { font-size: 13px; font-weight: 700; color: var(--muted); }
.plain { list-style: none; padding: 0; display: grid; gap: 10px; }
.plain li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
.plain .sub { flex-basis: 100%; color: var(--muted); font-size: 14px; }
.answers { margin: 0; }
.answers dt { font-weight: 600; }
.answers dd { margin: 0 0 6px; }

.actions { position: sticky; bottom: 0; z-index: 5; display: flex; gap: 10px; margin-top: 28px;
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
.actions .btn { flex: 1; }
.actions .btn.ghost { flex: 0 0 auto; }

footer.foot { display: grid; gap: 4px; margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 13.5px; }

@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation: none !important; transition: none !important; }
}
/* Windows high contrast drops backgrounds and shadows, so selection needs an outline there. */
@media (forced-colors: active) {
  .cb { appearance: auto; }
  .tile:has(input:checked), .seg label:has(input:checked) { outline: 3px solid Highlight; outline-offset: -3px; }
}

/* Print: the data check as it stands, with its details open, without controls.
   The dark theme is for the screen only, so print uses the light palette on white. */
@media print {
  :root { color-scheme: light; }
  body { font-size: 10.5pt; }
  .wrap { max-width: none; padding: 0; }
  .tools, .actions, .search, .empty-note, .check .btn { display: none !important; }
  .ccard, .hero, .tile { break-inside: avoid; }
  .hero, .ring, .tag, .tile, .seg label, .cb, .progress i { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" id="home" href=""><span class="logo-slot" id="logo"></span><span id="title"></span></a>
    <div class="tools">
      <button type="button" class="theme" id="theme" role="switch" aria-checked="false"><span class="track"><span class="knob">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </span></span></button>
      <div class="lang" role="group" id="lang-group">
        <button type="button" class="textbtn" data-lang="de" lang="de">DE</button>
        <button type="button" class="textbtn" data-lang="en" lang="en">EN</button>
      </div>
    </div>
  </header>
  <main>
    <section class="check" id="check"></section>
  </main>
  <footer class="foot"><p id="footer"></p><p id="meta"></p></footer>
</div>

    customer_master: '<path d="M4 9.5V20h16V9.5"/><path d="M3 9.5L4.6 4h14.8L21 9.5z"/><path d="M10 20v-5h4v5"/>',
    compliance: '<path d="M12 4v16M8 20h8M5 7h14"/><path d="M5 7l-2.5 6a2.5 2.5 0 0 0 5 0zM19 7l-2.5 6a2.5 2.5 0 0 0 5 0z"/>',
    hq_basic: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3.5"/>',
    hq_critical: '<path d="M12 3.5L2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17h.01"/>',
    public: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.2-3.6-8.5s1.2-6.2 3.6-8.5z"/>',
  };
  const verdicts = Object.fromEntries(DATA.verdicts.map(v => [v.key, v]));
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Browser storage can be blocked (private windows, strict policies); the guide must work without it.
  const load = () => { try { const l = localStorage.getItem(STORE); return LANGS.includes(l) ? l : "de"; } catch (e) { return "de"; } };
  const save = l => { try { localStorage.setItem(STORE, l); } catch (e) {} };
  let lang = load();

  const t = key => DATA.ui[lang][key];
  // A text with {placeholders} filled in; the values are HTML, the text itself is escaped.
  const fill = (key, values) => Object.entries(values).reduce((s, [k, v]) => s.replace(`{${k}}`, () => v), esc(t(key)));
  // A verdict tag: a coloured dot and the verdict's short word.
  const tag = key => `<span class="tag v-${key}">${esc(verdicts[key].short[lang])}</span>`;
  const golden = () => `<p class="quote"><strong>${esc(t("goldenRuleLabel"))}:</strong> ${esc(t("goldenRule"))}</p>`;

  // A configured link, opening in a new tab so the check keeps its answers; text defaults to the link's own label.
  function link(key, text = DATA.links[key].label[lang]) {
    const l = DATA.links[key], label = esc(text);
    return l.url === "PENDING" ? `<span class="pending">${label} (${esc(t("linkPending"))})</span>` : `<a href="${esc(l.url)}" target="_blank" rel="noopener">${label}</a>`;
  }
  // A condition as HTML; "only anonymised" conditions name the Data Preparation Guide as {link}.
  const condition = dp => esc(dp.condition[lang]).replace("{link}", () => link("prepGuide"));

  // ===== Data check. The answers live only in this page's memory: never stored, never sent. =====
  const UNLISTED = "unlisted", COND = "permitted_with_conditions";
  const usedClusters = DATA.clusters.filter(c => DATA.dataPoints.some(dp => dp.cluster === c.key));
  const point = row => DATA.dataPoints.find(dp => dp.row === row);
  const strictFirst = (a, b) => verdicts[a.verdict].rank - verdicts[b.verdict].rank || a.row - b.row;
  const blank = () => ({ clusters: [], points: [], conditions: {} });
  let answers = blank(), step = "start", history = [];
  let pq = "";  // the search text on question 2, cleared whenever the step changes

  // The outcome for a set of answers, strictest first, and the data points that decide it.
  function decide(a) {
    const points = a.points.map(point).filter(dp => dp && a.clusters.includes(dp.cluster)).sort(strictFirst);
    const unlisted = a.points.includes(UNLISTED);
    const asked = points.length > 0 && points[0].verdict === COND;  // a stricter data point decides without the conditions
    const answer = dp => asked ? a.conditions[dp.row] : undefined;
    const no = points.filter(dp => dp.verdict === "not_permitted" || answer(dp) === "no");
    const open = points.filter(dp => dp.verdict === COND && asked && answer(dp) !== "yes");
    const [key, deciding] = no.length ? ["not_permitted", no]
      : unlisted || open.length || !points.length ? ["clarify_first", open]
      : points[0].verdict === "internal_ai_only" ? ["internal_ai_only", points.filter(dp => dp.verdict === "internal_ai_only")]
      : asked ? [COND, points.filter(dp => dp.verdict === COND)]
      : ["permitted", points];
    return { key, deciding, points, unlisted, asked };
  }
  const next = (s, a) => s === "start" ? "clusters"
    : s === "clusters" ? "points"
    : s === "points" && decide(a).asked ? "conditions" : "result";
  const canContinue = (s, a) => s === "clusters" ? a.clusters.length > 0
    : s === "points" ? decide(a).points.length > 0 || decide(a).unlisted
    : s !== "conditions" || decide(a).points.every(dp => dp.verdict !== COND || a.conditions[dp.row]);

  const QUESTION = { clusters: 1, points: 2, conditions: 3 };
  const stepHeading = text => `<h1 id="check-step" tabindex="-1">${esc(text)}</h1>`;
  const progress = s => `<div class="progress" aria-hidden="true">${[1, 2, 3].map(i => `<i${i <= QUESTION[s] ? ' class="on"' : ""}></i>`).join("")}</div>
    <p class="kicker">${fill("questionOf", { n: QUESTION[s], total: 3 })}</p>`;
  const actions = (...buttons) => `<div class="actions">${buttons.map(([go, key]) =>
    `<button type="button" class="btn${go === "back" ? " ghost" : ""}" data-go="${go}">${esc(t(key))}</button>`).join("")}</div>`;
  const tile = (value, checked, name, hint, icon) => `<label class="tile">
    <input type="checkbox" name="cluster" value="${value}"${checked ? " checked" : ""}>${icon ? svg(icon, "ic", 1.8) : ""}
    <b>${esc(name)}</b><small>${esc(hint)}</small><span class="tick" aria-hidden="true">${svg(TICK, "", 3.2)}</span></label>`;
  const row = (value, checked, label) => `<label class="row"${value === UNLISTED ? "" : ` data-row="${value}"`}>
    <input class="cb" type="checkbox" name="point" value="${value}"${checked ? " checked" : ""}><span class="t">${label}</span></label>`;
  const said = (a, dp) => esc(t(a.conditions[dp.row] || "unsure"));
  const names = items => new Intl.ListFormat(lang, { type: "conjunction" }).format(items);

  function checkView(a) {
    if (step === "start") return `<div class="screen">${stepHeading(t("startQuestion"))}<p class="lead">${esc(t("checkIntro"))}</p>
      <button type="button" class="btn" data-go="next">${esc(t("startCheck"))}</button>${golden()}
      <p class="note">${svg(LOCK, "", 1.8)}${esc(t("privacyNote"))}</p></div>`;
    const nav = actions(["back", "back"], ["next", "continue"]);
    if (step === "clusters") return `<div class="screen">${progress(step)}${stepHeading(t("clustersQuestion"))}
      <fieldset><legend class="lead">${esc(t("tickAll"))}</legend><div class="tiles">${usedClusters.map(c =>
        tile(c.key, a.clusters.includes(c.key), c.name[lang], c.hint[lang], CLUSTER_ICON[c.key] || CLUSTER_ICON.hq_basic)).join("")}</div></fieldset></div>` + nav;
    if (step === "points") return `<div class="screen">${progress(step)}${stepHeading(t("pointsQuestion"))}
      <div><label class="sr" for="pq">${esc(t("pointsSearchLabel"))}</label><input class="search" id="pq" type="search" autocomplete="off"
        spellcheck="false" placeholder="${esc(t("pointsSearch"))}" value="${esc(pq)}"></div>
      ${usedClusters.filter(c => a.clusters.includes(c.key)).map(c => `<fieldset class="group" data-cluster="${c.key}"><legend>${esc(c.name[lang])}</legend>${DATA.dataPoints
        .filter(dp => dp.cluster === c.key).sort((x, y) => x.row - y.row)
        .map(dp => row(dp.row, a.points.includes(dp.row), esc(dp.name[lang]))).join("")}</fieldset>`).join("")}
      <p class="empty-note" id="pq-empty" hidden>${esc(t("pointsEmpty"))}</p>
      <fieldset class="group"><legend>${esc(t("other"))}</legend>${row(UNLISTED, a.points.includes(UNLISTED), esc(t("unlisted")))}</fieldset></div>` + nav;
    const d = decide(a), conds = d.points.filter(dp => dp.verdict === COND);
    if (step === "conditions") return `<div class="screen">${progress(step)}${stepHeading(t("conditionsQuestion"))}<p class="lead">${esc(t("conditionsIntro"))}</p>
      ${conds.map(dp => `<fieldset class="ccard" aria-describedby="cond-${dp.row}"><legend>${esc(dp.name[lang])}</legend>
        <p id="cond-${dp.row}">${condition(dp)}</p>
        <div class="seg">${["yes", "no", "unsure"].map(v => `<label><input type="radio" name="c-${dp.row}" value="${v}"${a.conditions[dp.row] === v ? " checked" : ""}><span>${esc(t(v))}</span></label>`).join("")}</div>
      </fieldset>`).join("")}</div>` + actions(["back", "back"], ["next", "showResult"]);

    // The reason names the deciding data points in bold: contained ones, conditions answered No or Not sure, and the "not listed" choices.
    const o = DATA.outcomes[d.key];
    const kind = dp => !d.asked || dp.verdict !== COND || a.conditions[dp.row] === "yes" ? "whyContains"
      : a.conditions[dp.row] === "no" ? "whyCannot" : "whyUnsure";
    const why = { whyContains: [], whyCannot: [], whyUnsure: [], whyChose: [] };
    d.deciding.forEach(dp => why[kind(dp)].push(`<b data-row="${dp.row}">${esc(dp.name[lang])}</b>`));
    if (d.key === "clarify_first") why.whyChose = [d.unlisted && t("unlisted")].filter(Boolean).map(x => `<b>${esc(x)}</b>`);
    const reason = Object.entries(why).filter(([, items]) => items.length).map(([key, items]) => fill(key, { items: names(items) })).join(" ");

    const todo = {
      not_permitted: () => `<h2>${esc(t("insteadHeading"))}</h2><ol class="steps"><li><span>${esc(o.whatToDo[lang])}</span></li>
        <li><span>${esc(t("checkAgain"))}</span></li><li><span>${esc(t("askSupport"))} ${link("axSupport")}</span></li></ol>`,
      clarify_first: () => `<h2>${esc(t("whatToDo"))}</h2><p>${esc(o.whatToDo[lang])} ${link("axSupport")}</p>`,
      internal_ai_only: () => `<h2>${esc(t("whatToDo"))}</h2><p>${esc(o.whatToDo[lang])} ${link("internalAi")}</p>`,
      [COND]: () => `<h2>${esc(t("mustHeading"))}</h2><ul class="must">${d.deciding.map(dp =>
        `<li>${svg(CHECKED)}<span><strong>${esc(dp.name[lang])}:</strong> ${condition(dp)}</span></li>`).join("")}
        <li>${svg(CHECKED)}<span>${esc(o.whatToDo[lang])}</span></li></ul>`,
      permitted: () => `<h2>${esc(t("whatToDo"))}</h2><p>${esc(o.whatToDo[lang])}</p>${golden()}`,
    }[d.key]();

    const count = d.points.length === 1 ? esc(t("onePoint")) : fill("nPoints", { n: d.points.length });
    const ticked = d.points.map(dp => `<li data-row="${dp.row}">${esc(dp.name[lang])}${tag(dp.verdict)}</li>`).join("")
      + (d.unlisted ? `<li>${esc(t("unlisted"))}</li>` : "");
    const clusters = a.clusters.map(k => DATA.clusters.find(c => c.key === k).name[lang]);
    const rule = dp => dp.verdict === COND ? condition(dp)
      : dp.verdict === "internal_ai_only" ? `${esc(t("internalOnly"))} ${link("internalAi")}` : esc(verdicts[dp.verdict].meaning[lang]);
    const inputs = `<details class="more inputs"><summary><span>${esc(t("yourChoices"))} (${count})</span></summary><div>
      ${ticked ? `<h3>${esc(t("tickedHeading"))}</h3><ul class="plain ticked">${ticked}</ul>` : ""}
      <h3>${esc(t("answersHeading"))}</h3><dl class="answers"><dt>${esc(t("clustersQuestion"))}</dt><dd>${esc(clusters.join(", "))}</dd>
        ${d.asked ? `<dt>${esc(t("conditionsQuestion"))}</dt>${conds.map(dp => `<dd>${esc(dp.name[lang])}: ${said(a, dp)}</dd>`).join("")}` : ""}</dl></div></details>`;
    // The rules page on Confluence is the reference; it has no address per data point, so every name opens the page.
    const rules = d.points.length ? `<details class="more rules-for"><summary><span>${esc(t("rulesForThese"))}</span></summary><div>
      <ul class="plain">${d.points.map(dp => `<li>${link("aiPolicy", dp.name[lang])}
        <span class="sub">${esc(verdicts[dp.verdict].label[lang])}: ${rule(dp)}</span></li>`).join("")}</ul></div></details>` : "";
    // "Preparing your data" only when the result asks to anonymise: a condition to follow that links the guide.
    const prepare = d.key === COND && d.deciding.some(dp => dp.condition[lang].includes("{link}"))
      ? `<div class="todo prep"><h2>${esc(t("prepareHeading"))}</h2><p>${fill("prepare", { link: link("prepGuide") })}</p></div>` : "";
    return `<div class="screen"><div class="hero v-${d.key}" data-outcome="${d.key}"><span class="ring">${svg(GLYPH[d.key], "", 2.6)}</span>
        ${stepHeading(o.heading[lang])}<p>${esc(o.reason[lang])}</p></div>
      ${reason ? `<p class="why deciding"><strong>${esc(t("decidingHeading"))}:</strong> ${reason}</p>` : ""}
      <div class="todo">${todo}</div><div>${inputs}${rules}</div>${prepare}</div>` + actions(["back", "changeLast"], ["restart", "restart"]);
  }

  function renderCheck(focus) {
    const el = $("check");
    el.dataset.step = step;
    el.setAttribute("aria-label", t("checkHeading"));
    el.innerHTML = checkView(answers);
    filterPoints();
    updateContinue();
    if (focus) {
      el.firstElementChild.classList.add("enter");
      scrollTo(0, 0);
      $("check-step").focus({ preventScroll: true });
    }
  }
  function updateContinue() {
    const b = $("check").querySelector('[data-go="next"]');
    if (!b || step === "start") return;
    b.disabled = !canContinue(step, answers);
    if (step !== "points") return;
    const n = $("check").querySelectorAll('input[name="point"]:checked').length;
    b.textContent = n ? `${t("continue")} · ${t("selected").replace("{n}", n)}` : t("continue");
  }
  // Question 2's search hides the rows that don't match; ticks on hidden rows stay.
  function filterPoints() {
    if (step !== "points") return;
    const groups = [...$("check").querySelectorAll(".group[data-cluster]")];
    for (const g of groups) {
      const rows = [...g.querySelectorAll("[data-row]")];
      rows.forEach(r => { r.hidden = !found(point(Number(r.dataset.row)), pq); });
      g.hidden = rows.every(r => r.hidden);
    }
    $("pq-empty").hidden = groups.some(g => !g.hidden);
  }

  function render() {
    document.documentElement.lang = lang;
    document.title = t("title");
    $("title").innerHTML = esc(t("title")).replace(/^(\S+)/, "<b>$1</b>");
    const date = new Date(DATA.meta.asOf + "T00:00:00").toLocaleDateString(lang === "de" ? "de-DE" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
    $("meta").textContent = `${t("version")} ${DATA.meta.version} · ${t("asOf")} ${date}`;
    $("lang-group").setAttribute("aria-label", t("language"));
    $("theme").setAttribute("aria-label", t("darkMode"));
    $("theme").title = t("darkMode");
    $("theme").setAttribute("aria-checked", document.documentElement.dataset.theme === "dark");
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $("footer").innerHTML = esc(t("footer")).replace("{link}", link("aiPolicy"));
    renderCheck(false);
  }

  // Search covers both languages whatever the display language, so "Seriennummer" and "serial" find the same data point.
  const fold = s => String(s).toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .normalize("NFD").replace(/[̀-ͯ]/g, "");
  const clusterOf = Object.fromEntries(DATA.clusters.map(c => [c.key, c]));
  const haystack = Object.fromEntries(DATA.dataPoints.map(dp => [dp.row, fold(LANGS.flatMap(l => [
    dp.name[l], dp.condition ? dp.condition[l].replace("{link}", DATA.links.prepGuide.label[l]) : "", clusterOf[dp.cluster].name[l], ...dp.keywords[l]]).join(" "))]));
  const found = (dp, q) => fold(q).split(/\s+/).filter(Boolean).every(term => haystack[dp.row].includes(term));

  const logoUrl = DATA.links.logo.url;
  if (logoUrl) { const img = new Image(); img.alt = "SEG"; img.src = logoUrl; $("logo").append(img); }

  $("lang-group").addEventListener("click", e => {
    const b = e.target.closest("button[data-lang]");
    if (!b) return;
    lang = b.dataset.lang; save(lang); render();
  });
  // The light/dark switch; "theming" lets the colours fade for the length of the switch only (see the styles).
  let fading;
  $("theme").addEventListener("click", () => {
    const root = document.documentElement;
    root.classList.add("theming");
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME, root.dataset.theme); } catch (e) {}
    $("theme").setAttribute("aria-checked", root.dataset.theme === "dark");
    clearTimeout(fading);
    fading = setTimeout(() => root.classList.remove("theming"), 400);
  });
  // The title in the header goes back to the start screen and forgets every answer, without reloading the page.
  $("home").addEventListener("click", e => {
    e.preventDefault();
    answers = blank(); history = []; step = "start"; pq = "";
    renderCheck(true);
  });
  $("check").addEventListener("input", e => { if (e.target.id === "pq") { pq = e.target.value; filterPoints(); } });
  $("check").addEventListener("change", e => {
    const el = e.target, ticked = name => [...$("check").querySelectorAll(`input[name="${name}"]:checked`)].map(x => x.value);
    if (el.name === "cluster") answers.clusters = ticked("cluster");
    else if (el.name === "point") answers.points = ticked("point").map(v => v === UNLISTED ? v : Number(v));
    else if (el.name.startsWith("c-")) answers.conditions[el.name.slice(2)] = el.value;
    updateContinue();
  });
  $("check").addEventListener("click", e => {
    const b = e.target.closest("[data-go]");
    if (!b) return;
    const go = b.dataset.go;
    pq = "";
    if (go === "next") { history.push(step); step = next(step, answers); }
    else if (go === "back") step = history.pop() || "start";
    else { answers = blank(); history = ["start"]; step = "clusters"; }
    renderCheck(true);
  });
  // Print shows the check as it stands, with its "more" rows open (see the print styles).
  let opened = [];
  window.addEventListener("beforeprint", () => { opened = [...document.querySelectorAll("#check details:not([open])")]; opened.forEach(d => { d.open = true; }); });
  window.addEventListener("afterprint", () => { opened.forEach(d => { d.open = false; }); opened = []; });
  render();
})();
</script>
</body>
</html>
